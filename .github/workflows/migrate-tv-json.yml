name: Migrate tv.json

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Download epg.xml from Release
        run: |
          curl -L -o epg.xml \
            https://github.com/teleonline/listas/releases/download/epg-latest/epg.xml

      - name: Run migration
        run: php scripts/migrate-tv-json.php

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: migrate tv.json epg_ids [skip ci]"
          file_pattern: "tv.json migration-report.txt"
