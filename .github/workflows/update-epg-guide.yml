name: Update EPG guide

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run EPG builder
        run: php scripts/build-epg-guide.php

      - name: Commit and push compressed files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update EPG guide [skip ci]"
          file_pattern: "epg.xml.gz epg.json.gz"

      - name: Upload uncompressed files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: epg-latest
          name: "EPG latest"
          body: |
            EPG files updated automatically.

            Includes both uncompressed files:
            - epg.xml
            - epg.json

            Compressed versions are available in the repository root:
            - epg.xml.gz
            - epg.json.gz
          files: |
            epg.xml
            epg.json
          make_latest: true
          overwrite_files: true
